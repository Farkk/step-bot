name: step
services:
  app:
    build: .
    image: step/app:local
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-step}:${POSTGRES_PASSWORD:-step_local_only}@postgres:5432/${POSTGRES_DB:-step}?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-step-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-step_local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-step_local_secret}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-local_webhook_secret}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-local_session_secret_replace_in_production}
    ports:
      - 127.0.0.1:${APP_HOST_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/server, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-step}
      POSTGRES_USER: ${POSTGRES_USER:-step}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-step_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    build: ./infra/minio
    image: step/minio:2025-09-07
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-step_local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-step_local_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  minio_data:
