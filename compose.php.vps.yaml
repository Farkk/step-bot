name: step-php

services:
  app:
    image: step/php:local
    build:
      context: .
      dockerfile: Dockerfile.php
    env_file: backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: https://step-bot.madebypavel.space
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: step
      DB_USERNAME: step
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - 127.0.0.1:8082:80
    volumes:
      - php_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  scheduler:
    image: step/php:local
    command:
      - sh
      - -c
      - 'while :; do php artisan schedule:run --no-interaction; sleep $$((60 - $$(date +%s) % 60)); done'
    env_file: backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: https://step-bot.madebypavel.space
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: step
      DB_USERNAME: step
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - php_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: step
      MYSQL_USER: step
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  mysql_data:
  php_storage:
